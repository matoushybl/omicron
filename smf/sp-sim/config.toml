# eitri lab: poll the real iDRAC and push its readings into the sensors
# above (and into PSU0's InputVoltage rail entries).
[real_sensor_source]
base_url = "https://192.168.1.250"
username = "root"
password = "calvin"
poll_interval_secs = 30
insecure_tls = true

[log]
# Show log messages of this level and more severe
level = "debug"

# Example output to a terminal (with colors)
mode = "stderr-terminal"

# Example output to a file, appending if it already exists.
#mode = "file"
#path = "logs/server.log"
#if_exists = "append"
